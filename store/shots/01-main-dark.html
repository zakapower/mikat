<!doctype html>
<html lang="ru" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <title>Mikat shot — main dark</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=Literata:opsz,wght@7..72,600;7..72,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../popup/popup.css" />
    <style>
      html,
      body {
        width: 1280px !important;
        height: 800px !important;
        max-height: none !important;
        margin: 0;
        overflow: hidden;
        background: #0c0a12;
      }
      body {
        display: grid;
        place-items: center;
        background:
          radial-gradient(70% 55% at 50% 20%, #2a1f45 0%, transparent 55%),
          #0c0a12;
      }
      .frame {
        width: 360px;
        border-radius: 14px;
        overflow: hidden;
        box-shadow:
          0 0 0 1px rgba(167, 139, 250, 0.2),
          0 28px 80px rgba(0, 0, 0, 0.55);
      }
      .frame body,
      .popup-root {
        width: 360px;
      }
      .popup-root {
        font-family: 'IBM Plex Sans', 'Segoe UI', sans-serif;
        font-size: 15px;
        line-height: 1.45;
        color: var(--ink);
        background:
          radial-gradient(
            80% 50% at 100% 0%,
            color-mix(in srgb, var(--wash) 70%, transparent),
            transparent 60%
          ),
          var(--bg);
      }
      .icon {
        width: 1.15rem;
        height: 1.15rem;
        display: block;
      }
      .icon-btn .icon {
        width: 1.15rem;
        height: 1.15rem;
      }
      .next__countdown-icon .icon,
      .place-bar__icon .icon,
      .settings-block__icon .icon {
        width: 1rem;
        height: 1rem;
      }
      .shot-caption {
        position: absolute;
        left: 64px;
        bottom: 56px;
        color: #cfc6e2;
        font-family: 'IBM Plex Sans', sans-serif;
        font-size: 22px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      .shot-brand {
        position: absolute;
        left: 64px;
        top: 56px;
        font-family: Literata, Georgia, serif;
        font-size: 42px;
        font-weight: 700;
        color: #eeeaf6;
        letter-spacing: -0.04em;
      }
      .shot-sub {
        position: absolute;
        left: 64px;
        top: 112px;
        color: #a39bb0;
        font-family: 'IBM Plex Sans', sans-serif;
        font-size: 18px;
        max-width: 360px;
      }
    </style>
  </head>
  <body>
    <div class="shot-brand">Микат</div>
    <div class="shot-sub">Времена намаза · countdown на иконке · уведомления</div>
    <div class="frame">
      <div class="popup-root" data-theme="dark">
        <div class="app">
          <section class="view view--main">
            <header class="header">
              <h1 class="brand">Микат</h1>
              <div class="header__actions">
                <span class="icon-btn" aria-hidden="true">
                  <svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg>
                </span>
                <span class="icon-btn" aria-hidden="true"><span style="font-size:0.72rem;font-weight:700">EN</span></span>
                <span class="icon-btn" aria-hidden="true">
                  <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
                </span>
                <span class="icon-btn" aria-hidden="true">
                  <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
                </span>
              </div>
            </header>
            <section class="next">
              <p class="next__label">Следующий намаз</p>
              <p class="next__name">Магриб</p>
              <p class="next__time">18:42</p>
              <p class="next__countdown">
                <span class="next__countdown-icon">
                  <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                </span>
                <span>через 1 ч 24 мин</span>
              </p>
            </section>
            <ul class="prayer-list">
              <li><strong>Фаджр</strong><span>04:18</span></li>
              <li><strong>Восход</strong><span>05:51</span></li>
              <li><strong>Зухр</strong><span>12:14</span></li>
              <li><strong>Аср</strong><span>15:47</span></li>
              <li class="is-next"><strong>Магриб</strong><span>18:42</span></li>
              <li><strong>Иша</strong><span>20:12</span></li>
            </ul>
            <footer class="place-bar">
              <p class="place-bar__label">
                <span class="place-bar__icon">
                  <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></svg>
                </span>
                <span>Махачкала, Дагестан</span>
              </p>
              <span class="icon-btn" aria-hidden="true">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="2" x2="5" y1="12" y2="12"/><line x1="19" x2="22" y1="12" y2="12"/><line x1="12" x2="12" y1="2" y2="5"/><line x1="12" x2="12" y1="19" y2="22"/><circle cx="12" cy="12" r="7"/></svg>
              </span>
            </footer>
          </section>
        </div>
      </div>
    </div>
    <div class="shot-caption">Главный экран · тёмная тема</div>
  </body>
</html>
